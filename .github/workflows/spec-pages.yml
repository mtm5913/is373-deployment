name: Publish specification
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build_spec.py', 'scripts/spec-template.html', '.github/workflows/spec-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specification-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/build_spec.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
